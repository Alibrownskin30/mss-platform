<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#050811" />

<title>MSS Protocol — Redirecting to Sentinel Operations</title>

<meta http-equiv="refresh" content="0; url=/sentinel-admin.html" />

<style>
:root {
--bg: #050811;
--panel: rgba(8, 14, 27, 0.96);
--border: rgba(115, 185, 255, 0.16);
--text: #eef6ff;
--muted: rgba(198, 211, 226, 0.68);
--accent: #8fe3ff;
}

* {
box-sizing: border-box;
}

html,
body {
min-height: 100%;
margin: 0;
}

body {
min-height: 100vh;
display: grid;
place-items: center;
padding: 24px;
color: var(--text);
font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background:
radial-gradient(circle at 50% 12%, rgba(79, 195, 255, 0.12), transparent 34%),
linear-gradient(180deg, #050811 0%, #02050c 100%);
}

.redirect-card {
width: min(480px, 100%);
padding: 30px;
border-radius: 22px;
border: 1px solid var(--border);
background: var(--panel);
box-shadow: 0 28px 70px rgba(0, 0, 0, 0.4);
}

.redirect-eyebrow {
margin-bottom: 14px;
color: var(--accent);
font-size: 11px;
font-weight: 900;
letter-spacing: 0.16em;
text-transform: uppercase;
}

h1 {
margin: 0 0 10px;
font-size: clamp(25px, 4vw, 31px);
line-height: 1.15;
letter-spacing: -0.04em;
}

p {
margin: 0 0 22px;
color: var(--muted);
font-size: 14px;
line-height: 1.65;
}

a {
display: inline-flex;
align-items: center;
min-height: 44px;
padding: 0 17px;
border-radius: 12px;
border: 1px solid rgba(99, 184, 255, 0.42);
background: linear-gradient(135deg, rgba(38, 116, 211, 0.92), rgba(44, 168, 228, 0.86));
color: var(--text);
font-size: 13px;
font-weight: 800;
text-decoration: none;
}
</style>
</head>

<body>
<main class="redirect-card">
<div class="redirect-eyebrow">MSS Protocol · Internal Administration</div>
<h1>Opening Sentinel Operations.</h1>
<p>
Sentinel settings are now managed from the protected Sentinel Operations admin terminal.
</p>
<a href="/sentinel-admin.html">Continue to Sentinel Operations</a>
</main>

<script>
window.location.replace("/sentinel-admin.html");
</script>
</body>
</html>
